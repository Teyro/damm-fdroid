# F-Droid-Repo der Damm-Apps – gebaut von .github/workflows/repo.yml
repo_url: https://teyro.github.io/damm-fdroid/repo
repo_name: Damm-Apps
repo_icon: icon.png
repo_description: >-
  Apps der Schule Öjendorfer Damm für interaktive Displays (Clevertouch, CTOUCH):
  DammBoard, DammZeit und DammLauncher. Die APKs sind dieselben wie in den
  GitHub-Releases der jeweiligen Apps.
archive_older: 0
keystore: keystore.p12
repo_keyalias: damm-fdroid
keystorepass:
  env: FDROID_KEYSTORE_PASS
keypass:
  env: FDROID_KEYSTORE_PASS
keydname: CN=Damm-Apps F-Droid, O=Teyro
