Name: DammZeit
Summary: Visueller Timer im Stil des Time Timers, mit Stoppuhr
Description: |-
  Großer, gut sichtbarer Timer für interaktive Displays im Klassenraum: die Zeitscheibe
  schrumpft sekundengenau, dazu Stoppuhr mit Runden und Bestenliste (Siegertreppchen).
  Widgets für den Startbildschirm.
