Name: DammZahlen
Summary: Mathe-Legetafel für Klasse 1 und 2 (Zehnerfeld, Zwanzigerfeld, Zehnerübergang)
Description: |-
  Mathe-Legetafel für interaktive Tafeln im Grundschul-Unterricht (Bildungsplan Hamburg):
  Zehner-, Zwanziger- und Hunderterfeld mit Wendeplättchen, Doppeldecker-Bus mit Kindern,
  Rechenrahmen, Zahlenstrahl und Rechenstrich. Der Zehnerübergang wird Schritt für Schritt
  gezeigt. Blitzblick und Kindermodus mit PIN. Keine Namen, keine Lernstände, kein Konto.
